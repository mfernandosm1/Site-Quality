<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quality Celulares</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="/site/css/style.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9HPD9XCELH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-9HPD9XCELH');
  </script>
</head>

<body>
  <div id="header"></div>

  <section class="banner">
    <div class="swiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <picture>
            <source media="(max-width: 767px)" srcset="/site/images/banner2-mobile.png">
            <img src="/site/images/banner2.png" alt="" class="banner-img">
          </picture>
        </div>
        <div class="swiper-slide">
          <picture>
            <source media="(max-width: 767px)" srcset="/site/images/banner3-mobile.png">
            <img src="/site/images/banner3.png" alt="" class="banner-img">
          </picture>
        </div>
        <div class="swiper-slide">
          <picture>
            <source media="(max-width: 767px)" srcset="/site/images/Banner-sitemobile.jpg">
            <img src="/site/images/Bannerpdesktop.jpg" alt="" class="banner-img">
          </picture>
        </div>
      </div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
    </div>
  </section>

  <main class="main">
    <h2 style="text-align:center; margin-top: 40px;">Produtos em Destaque</h2>

    <div class="carousel-container">
      <button class="carousel-arrow left" onclick="scrollCarousel(-1)">❮</button>
      <div class="carousel-track" id="carousel1"></div>
      <button class="carousel-arrow right" onclick="scrollCarousel(1)">❯</button>
    </div>

    <p id="no-results" class="em-breve" style="display:none; text-align:center; margin-top:20px;">
      Nenhum produto na vitrine ainda.
    </p>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="/site/js/main.js"></script>

  <script>
  function scrollCarousel(dir) {
    const track = document.getElementById('carousel1');
    if (track) track.scrollBy({ left: dir * 300, behavior: 'smooth' });
  }

  function escapeHtml(value){
    return (value || '').toString()
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function hasGallery(p){
    return Array.isArray(p.gallery) && p.gallery.filter(Boolean).length > 0;
  }

  function shouldShowPrice(p){
    const raw = p.showPrice ?? p.mostrar_preco ?? p.show_price ?? p.mostrarPreco ?? p.priceVisible ?? false;
    if (raw === true) return true;
    const v = raw.toString().toLowerCase();
    return v === 'sim' || v === 'yes' || v === 'true' || v === '1' || v === 'on';
  }

  function productImagePath(path){
    if (!path) return '/site/images/sem-imagem.png';
    if (/^https?:\/\//i.test(path)) return path;
    return '/site/' + path.replace(/^\//, '');
  }

  fetch('/site/content/products.json')
    .then(r => r.json())
    .then(data => {
      const track = document.getElementById('carousel1');
      const produtos = (data.items || []).filter(p => p.active !== false && p.featured === true);

      if (!track || produtos.length === 0) {
        document.getElementById('no-results').style.display = 'block';
        return;
      }

      produtos.forEach(p => {
        const card = document.createElement('div');
        card.className = 'produto-card product-card';

        const precoHTML = shouldShowPrice(p)
          ? `<p>R$ ${(Number(p.price) || 0).toFixed(2).replace('.', ',')}</p>`
          : '';

        const detalhesHTML = (p.detailsEnabled || hasGallery(p))
          ? `<a href="/produto/${encodeURIComponent(p.slug || p.id)}/" class="btn btn-details">Ver detalhes</a>`
          : '';

        card.innerHTML = `
          <img src="${escapeHtml(productImagePath(p.image || 'images/sem-imagem.png'))}" alt="${escapeHtml(p.name || '')}">
          <h3>${escapeHtml(p.name || '')}</h3>
          ${precoHTML}
          ${detalhesHTML}
          <a href="https://wa.me/5555991407824?text=Olá!%20Vim%20através%20do%20site%20e%20tenho%20interesse%20em%20${encodeURIComponent(p.name || 'produto')}"
             class="btn" target="_blank">
             <i class="fa-brands fa-whatsapp"></i> Comprar no Whatsapp
          </a>
        `;
        track.appendChild(card);
      });
    })
    .catch(() => {
      document.getElementById('no-results').style.display = 'block';
    });
  </script>
</body>
</html>
