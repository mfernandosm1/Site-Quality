<body>
  <div id="header"></div>

  <section class="banner">

          <picture>

        </div>
        <div class="swiper-slide">
          <picture>
            <source media="(max-width: 767px)" srcset="/images/banner3-mobile.png">
            <img src="/images/banner3.png" alt="" class="banner-img">

        </div>

          <picture>
            <source media="(max-width: 767px)" srcset="/images/Banner-sitemobile.jpg">
            <img src="/images/Bannerpdesktop.jpg" alt="" class="banner-img">

  <main class="main">
    <h2 style="text-align:center; margin-top: 40px;">Produtos em Destaque</h2>

    <div class="carousel-container">
      <button class="carousel-arrow left" onclick="scrollCarousel(-1)">❮</button>
      <div class="carousel-track" id="carousel1"></div>
      <button class="carousel-arrow right" onclick="scrollCarousel(1)">❯</button>
    </div>

    <p id="no-results" class="em-breve" style="display:none; text-align:center; margin-top:20px;">
      Nenhum produto na vitrine ainda.
    </p>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="/js/main.js?v=20260610"></script>

  <script>
  function scrollCarousel(dir) {
    const track = document.getElementById('carousel1');
    if (track) track.scrollBy({ left: dir * 300, behavior: 'smooth' });
  }

  function escapeHtml(value){
    return (value || '').toString()
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }





  /* V8.1.1 - Favoritos e Compartilhar sem login */
  function qualityProductKey(p){
    return String(p?.slug || p?.id || p?._id || p?.name || p?.nome || '').trim();
  }

  function qualityCleanUrl(url){
    if (!url || url === '#') return window.location.href;
    try { return new URL(url, window.location.origin).href; }
    catch { return window.location.href; }
  }

  function qualityProductPayloadFromButton(btn){
    return {
      id: btn.getAttribute('data-id') || '',
      slug: btn.getAttribute('data-slug') || '',
      name: btn.getAttribute('data-name') || 'Produto',
      image: btn.getAttribute('data-image') || '',
      url: qualityCleanUrl(btn.getAttribute('data-url') || '')
    };
  }

  function qualityReadStorage(key){
    try { return JSON.parse(localStorage.getItem(key) || '[]'); }
    catch { return []; }
  }

  function qualityWriteStorage(key, items){
    try { localStorage.setItem(key, JSON.stringify(items)); } catch {}
  }

  function qualityFavoriteKey(){ return 'quality_favoritos_v811'; }
  function qualityRecentKey(){ return 'quality_vistos_recentemente_v811'; }

  /* V8.2.2 - Acesso rápido aos favoritos no menu + contador discreto */
  function qualityFavoriteItems(){
    const seen = new Set();
    return qualityReadStorage(qualityFavoriteKey()).filter(item => {
      const key = qualitySavedProductKey(item);
      if (!key || seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  function qualityFavoriteCount(){
    return qualityFavoriteItems().length;
  }

  function qualityMenuLinkHtml(count){
    return '<i class="fa-solid fa-heart"></i><span>Favoritos</span><span class="quality-favorites-count">' + count + '</span>';
  }

  function qualityEnsureFavoritesMenu(){
    const count = qualityFavoriteCount();
    document.querySelectorAll('[data-quality-open-favorites]').forEach(link => {
      if (!count) link.remove();
    });
    if (!count) return;

    const targets = [
      { nav: document.getElementById('nav-desktop'), mobile:false },
      { nav: document.getElementById('nav-mobile'), mobile:true }
    ];

    targets.forEach(({ nav, mobile }) => {
      if (!nav) return;
      let link = nav.querySelector('[data-quality-open-favorites]');
      if (!link) {
        link = document.createElement('a');
        link.href = '#favoritos';
        link.className = 'quality-favorites-menu-link' + (mobile ? ' mobile' : '');
        link.setAttribute('data-quality-open-favorites', '1');
        link.setAttribute('aria-label', 'Abrir favoritos');
        const search = nav.querySelector('.search-wrapper');
        if (search && search.parentNode === nav) nav.insertBefore(link, search);
        else nav.appendChild(link);
      }
      link.innerHTML = qualityMenuLinkHtml(count);
    });
  }

  function qualityFavoriteImageUrl(path){
    const p = String(path || '').trim();
    if (!p) return '/images/sem-imagem.png';
    if (/^https?:\/\//i.test(p)) return p;
    return '/' + p.replace(/^\/+/, '').replace(/^site\//, '');
  }

  function qualityFavoriteItemHtml(item){
    const name = item.name || item.nome || 'Produto';
    const url = qualityCleanUrl(item.url || (item.slug ? '/produto/' + encodeURIComponent(item.slug) + '/' : '#'));
    const key = qualitySavedProductKey(item);
    return '<div class="quality-favorites-panel-item">' +
      '<a class="quality-favorites-panel-img" href="' + escapeHtml(url) + '"><img src="' + escapeHtml(qualityFavoriteImageUrl(item.image || item.imagem)) + '" alt="' + escapeHtml(name) + '" onerror="this.onerror=null;this.src=\'/images/sem-imagem.png\';"></a>' +
      '<div class="quality-favorites-panel-info">' +
        '<a class="quality-favorites-panel-name" href="' + escapeHtml(url) + '">' + escapeHtml(name) + '</a>' +
        '<div class="quality-favorites-panel-actions">' +
          '<a href="' + escapeHtml(url) + '" class="btn-details quality-favorites-see">Ver detalhes</a>' +
          '<button type="button" class="quality-favorites-remove" data-quality-remove-favorite="' + escapeHtml(key) + '">Remover</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function qualityRenderFavoritesPanel(){
    let panel = document.querySelector('.quality-favorites-panel');
    if (!panel) {
      panel = document.createElement('div');
      panel.className = 'quality-favorites-panel';
      panel.innerHTML = '<div class="quality-favorites-panel-backdrop" data-quality-close-favorites></div>' +
        '<aside class="quality-favorites-panel-box" aria-label="Meus favoritos">' +
          '<div class="quality-favorites-panel-head"><strong>❤️ Meus favoritos</strong><button type="button" data-quality-close-favorites aria-label="Fechar">×</button></div>' +
          '<div class="quality-favorites-panel-body"></div>' +
        '</aside>';
      document.body.appendChild(panel);
    }
    const body = panel.querySelector('.quality-favorites-panel-body');
    const items = qualityFavoriteItems();
    body.innerHTML = items.length
      ? items.map(qualityFavoriteItemHtml).join('')
      : '<p class="quality-favorites-empty">Você ainda não favoritou nenhum produto.</p>';
    panel.classList.add('show');
    document.body.classList.add('quality-favorites-open');
  }

  function qualityCloseFavoritesPanel(){
    const panel = document.querySelector('.quality-favorites-panel');
    if (panel) panel.classList.remove('show');
    document.body.classList.remove('quality-favorites-open');
  }

  function qualityRefreshFavoritesUX(){
    qualityEnsureFavoritesMenu();
    const panel = document.querySelector('.quality-favorites-panel.show');
    if (panel) {
      const body = panel.querySelector('.quality-favorites-panel-body');
      const items = qualityFavoriteItems();
      if (body) body.innerHTML = items.length ? items.map(qualityFavoriteItemHtml).join('') : '<p class="quality-favorites-empty">Você ainda não favoritou nenhum produto.</p>';
    }
  }


  function qualityIsFavorite(id){
    const key = String(id || '').trim().toLowerCase();
    if (!key) return false;
    return qualityReadStorage(qualityFavoriteKey()).some(item => {
      const itemKey = qualitySavedProductKey ? qualitySavedProductKey(item) : String(item.id || item.slug || '').toLowerCase();
      return itemKey === key || String(item.id || item.slug || '').toLowerCase() === key;
    });
  }

  function qualityToggleFavorite(product){
    const id = String(product.slug || product.id || '').trim();
    const key = qualitySavedProductKey(product);
    if (!id && !key) return false;
    let items = qualityReadStorage(qualityFavoriteKey());
    const exists = items.some(item => {
      const itemKey = qualitySavedProductKey(item);
      return itemKey === key || String(item.id || item.slug || '') === id;
    });
    if (exists) {
      items = items.filter(item => {
        const itemKey = qualitySavedProductKey(item);
        return itemKey !== key && String(item.id || item.slug || '') !== id;
      });
    } else {
      items.unshift({ ...product, id: product.id || id || key, slug: product.slug || id || key, savedAt: Date.now() });
    }
    qualityWriteStorage(qualityFavoriteKey(), items.slice(0, 60));
    return !exists;
  }

  function qualitySavedProductKey(item){
    return String(item?.slug || item?.id || item?.url || item?.name || '').trim().toLowerCase();
  }

  function qualitySaveRecent(product){
    const id = String(product.slug || product.id || '').trim();
    const key = qualitySavedProductKey(product);
    if (!id && !key) return;
    let items = qualityReadStorage(qualityRecentKey()).filter(item => {
      const itemKey = qualitySavedProductKey(item);
      return itemKey && itemKey !== key && String(item.id || item.slug || '') !== id;
    });
    items.unshift({ ...product, id: product.id || id || key, slug: product.slug || id || key, viewedAt: Date.now() });
    qualityWriteStorage(qualityRecentKey(), items.slice(0, 20));
  }

  function qualityToast(message){
    try {
      let el = document.querySelector('.quality-fav-toast');
      if (!el) {
        el = document.createElement('div');
        el.className = 'quality-fav-toast';
        document.body.appendChild(el);
      }
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(window.__qualityFavToastTimer);
      window.__qualityFavToastTimer = setTimeout(() => el.classList.remove('show'), 1600);
    } catch {}
  }

  function qualityUpdateFavoriteButtons(){
    document.querySelectorAll('[data-quality-fav]').forEach(btn => {
      const id = btn.getAttribute('data-slug') || btn.getAttribute('data-id') || '';
      const active = qualityIsFavorite(id);
      btn.classList.toggle('is-active', active);
      btn.setAttribute('aria-label', active ? 'Remover dos favoritos' : 'Favoritar produto');
      btn.setAttribute('title', active ? 'Remover dos favoritos' : 'Favoritar');
      if (btn.classList.contains('quality-detail-action')) {
        btn.innerHTML = active ? '<i class="fa-solid fa-heart"></i> Favoritado' : '<i class="fa-regular fa-heart"></i> Favoritar';
      } else {
        btn.innerHTML = active ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
      }
    });
  }

  async function qualityShareProduct(product){
    const title = product.name || 'Produto Quality Celulares';
    const url = qualityCleanUrl(product.url || '');
    const text = 'Olha este produto da Quality Celulares: ' + title;
    if (navigator.share) {
      try { await navigator.share({ title, text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try {
      await navigator.clipboard.writeText(url);
      alert('Link do produto copiado!');
    } catch {
      window.prompt('Copie o link do produto:', url);
    }
  }

  function qualityProductActionsHtml(p, url){
    const name = p.name || p.nome || 'Produto';
    const img = p.image || p.imagem || 'images/sem-imagem.png';
    const slug = p.slug || p.id || p._id || '';
    const id = p.id || slug;
    const detailUrl = url || (slug ? '/produto/' + encodeURIComponent(slug) + '/' : window.location.href);
    return '<div class="quality-card-actions">' +
      '<button type="button" class="quality-card-action quality-favorite-btn" data-quality-fav data-id="' + escapeHtml(id) + '" data-slug="' + escapeHtml(slug) + '" data-name="' + escapeHtml(name) + '" data-image="' + escapeHtml(img) + '" data-url="' + escapeHtml(detailUrl) + '" aria-label="Favoritar produto" title="Favoritar"><i class="fa-regular fa-heart"></i></button>' +
      '<button type="button" class="quality-card-action quality-share-btn" data-quality-share data-id="' + escapeHtml(id) + '" data-slug="' + escapeHtml(slug) + '" data-name="' + escapeHtml(name) + '" data-image="' + escapeHtml(img) + '" data-url="' + escapeHtml(detailUrl) + '" aria-label="Compartilhar produto" title="Compartilhar"><i class="fa-solid fa-share-nodes"></i></button>' +
    '</div>';
  }

  function qualityBindProductActions(){
    if (window.__qualityProductActionsBoundV8112) { qualityUpdateFavoriteButtons(); qualityRefreshFavoritesUX(); return; }
    window.__qualityProductActionsBoundV8112 = true;
    document.addEventListener('click', function(ev){
      const fav = ev.target.closest('[data-quality-fav]');
      const share = ev.target.closest('[data-quality-share]');
      const openFavorites = ev.target.closest('[data-quality-open-favorites]');
      const closeFavorites = ev.target.closest('[data-quality-close-favorites]');
      const removeFavorite = ev.target.closest('[data-quality-remove-favorite]');
      if (!fav && !share && !openFavorites && !closeFavorites && !removeFavorite) return;
      ev.preventDefault();
      ev.stopPropagation();

      if (openFavorites) { qualityRenderFavoritesPanel(); return; }
      if (closeFavorites) { qualityCloseFavoritesPanel(); return; }
      if (removeFavorite) {
        const removeKey = removeFavorite.getAttribute('data-quality-remove-favorite') || '';
        const items = qualityFavoriteItems().filter(item => qualitySavedProductKey(item) !== removeKey);
        qualityWriteStorage(qualityFavoriteKey(), items);
        qualityUpdateFavoriteButtons();
        qualityRefreshFavoritesUX();
        qualityToast('Produto removido dos favoritos');
        return;
      }

      const btn = fav || share;
      const product = qualityProductPayloadFromButton(btn);
      if (fav) {
        const active = qualityToggleFavorite(product);
        qualityUpdateFavoriteButtons();
        qualityRefreshFavoritesUX();
        btn.classList.add('quality-action-pulse');
        qualityToast(active ? 'Produto adicionado aos favoritos ❤️' : 'Produto removido dos favoritos');
        setTimeout(() => btn.classList.remove('quality-action-pulse'), 260);
      } else {
        qualityShareProduct(product);
      }
    }, true);
    qualityUpdateFavoriteButtons();
    qualityRefreshFavoritesUX();
    setTimeout(qualityRefreshFavoritesUX, 350);
  }

  function normalizeText(value){
    return (value || '').toString()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .trim()
      .toLowerCase();
  }

  function productTagInfo(tag){
    const label = String(tag || '').trim();
    const key = normalizeText(label);
    if (key.includes('oferta')) return { label, cls:'oferta', icon:'fa-solid fa-fire' };
    if (key.includes('lancamento') || key.includes('lançamento')) return { label, cls:'lancamento', icon:'fa-solid fa-rocket' };
    if (key.includes('mais vendido') || key.includes('vendido')) return { label, cls:'mais-vendido', icon:'fa-solid fa-star' };
    if (key.includes('ultima') || key.includes('última')) return { label, cls:'ultimas', icon:'fa-solid fa-bolt' };
    if (key.includes('preco') || key.includes('preço') || key.includes('baixou')) return { label, cls:'preco-baixou', icon:'fa-solid fa-tags' };
    if (key.includes('frete')) return { label, cls:'frete', icon:'fa-solid fa-truck-fast' };
    if (key.includes('novo') || key.includes('novidade')) return { label, cls:'novo', icon:'fa-solid fa-sparkles' };
    if (key.includes('seminovo')) return { label, cls:'seminovo', icon:'fa-solid fa-shield-halved' };
    return { label, cls:'padrao', icon:'fa-solid fa-tag' };
  }


  function qualityCompactCardTagLabel(label){
    const text = String(label || '').trim();
    const key = normalizeText(text);
    if (key.includes('ultima') || key.includes('última')) return 'Últimas unidades';
    if (key.includes('lancamento') || key.includes('lançamento')) return 'Lançamento';
    if (key.includes('mais vendido') || key.includes('vendido')) return 'Mais vendido';
    if (key.includes('preco') || key.includes('preço') || key.includes('baixou')) return 'Preço baixou';
    return text;
  }

  function productTagsHtml(p, limit){
    const tags = Array.isArray(p.tags) ? p.tags : String(p.tags || '').split(/\r?\n|,/);
    const clean = tags.map(t => String(t || '').trim()).filter(Boolean).slice(0, limit || 2);
    if (!clean.length) return '';
    return '<div class="quality-card-tags premium-card-tags">' + clean.map(t => {
      const info = productTagInfo(t);
      return '<span class="quality-product-tag tag-' + info.cls + '"><i class="' + info.icon + '"></i>' + escapeHtml(typeof qualityCompactCardTagLabel === 'function' ? qualityCompactCardTagLabel(info.label) : info.label) + '</span>';
    }).join('') + '</div>';
  }

  function hasGallery(p){
    return Array.isArray(p.gallery) && p.gallery.filter(Boolean).length > 0;
  }

  function shouldShowPrice(p){
    const raw = p.showPrice ?? p.mostrar_preco ?? p.show_price ?? p.mostrarPreco ?? p.priceVisible ?? false;
    if (raw === true) return true;
    const v = raw.toString().toLowerCase();
    return v === 'sim' || v === 'yes' || v === 'true' || v === '1' || v === 'on';
  }

  function productImagePath(path){
    if (!path) return '/images/sem-imagem.png';
    if (/^https?:\/\//i.test(path)) return path;
    return '/' + path.replace(/^\//, '');
  }

  function shouldShowVariationsOnCard(p){
    const raw = p.showVariationsOnCard ?? p.mostrarVariacoesNoCard ?? p.show_variations_on_card ?? false;
    if (raw === true) return true;
    const v = String(raw || '').toLowerCase();
    return v === 'sim' || v === 'yes' || v === 'true' || v === '1' || v === 'on';
  }

  function productVariationsCardHtml(p){
    if (!shouldShowVariationsOnCard(p)) return '';
    const v = p.variations || {};
    const lines = value => Array.isArray(value)
      ? value.map(x => (x || '').toString().trim()).filter(Boolean)
      : (value || '').toString().split(/\r?\n|,/).map(x => x.trim()).filter(Boolean);

    const colorItems = Array.isArray(v.colors)
      ? v.colors.map(c => ({ name: (c.name || '').trim(), hex: (c.hex || '').trim() })).filter(c => c.name)
      : lines(v.colorsText).map(line => {
          const parts = line.split('|').map(x => x.trim());
          return { name: parts[0] || '', hex: parts[1] || '' };
        }).filter(c => c.name);

    const combos = Array.isArray(v.combinations)
      ? v.combinations
      : lines(v.combinationsText).map(line => {
          const parts = line.split('|').map(x => x.trim());
          return { color: parts[0] || '', storage: parts[1] || '', ram: parts[2] || '', condition: parts[3] || '' };
        });

    const storage = (Array.isArray(v.storage) ? v.storage : lines(v.storageText)).concat(combos.map(c => c.storage || '')).filter(Boolean);
    const ram = (Array.isArray(v.ram) ? v.ram : lines(v.ramText)).concat(combos.map(c => c.ram || '')).filter(Boolean);

    const unique = arr => [...new Set(arr.map(x => (x || '').toString().trim()).filter(Boolean))];
    const colors = unique(colorItems.map(c => c.name)).slice(0, 6).map(name => colorItems.find(c => c.name === name));
    const tags = unique([...storage, ...ram]).slice(0, 6);

    if (!colors.length && !tags.length) return '';

    const dots = colors.length
      ? '<div class="product-card-variation-colors">' + colors.map(c => {
          const hex = /^#?[0-9a-f]{3,8}$/i.test(c.hex || '') ? (c.hex.charAt(0) === '#' ? c.hex : '#' + c.hex) : '';
          const style = hex ? ' style="background:' + escapeHtml(hex) + '"' : '';
          return '<span class="product-card-color-dot"' + style + ' title="' + escapeHtml(c.name) + '"></span>';
        }).join('') + '</div>'
      : '';

    const chips = tags.length
      ? '<div class="product-card-variation-tags">' + tags.map(opt => '<span>' + escapeHtml(opt) + '</span>').join('') + '</div>'
      : '';

    return '<div class="product-card-variations">' + dots + chips + '</div>';
  }


  fetch('/content/products.json')
    .then(r => r.json())
    .then(data => {
      const track = document.getElementById('carousel1');
      const produtos = (data.items || []).filter(p => p.active !== false && p.featured === true);

      if (!track || produtos.length === 0) {
        document.getElementById('no-results').style.display = 'block';
        return;
      }

      produtos.forEach(p => {
        const card = document.createElement('div');
        card.className = 'produto-card product-card';

        const precoHTML = shouldShowPrice(p)
          ? `<p>R$ ${(Number(p.price) || 0).toFixed(2).replace('.', ',')}</p>`
          : '';

        const detalhesHTML = (p.detailsEnabled || hasGallery(p))
          ? `<a href="/produto/${encodeURIComponent(p.slug || p.id)}/" class="btn btn-details">Ver detalhes</a>`
          : '';

        card.innerHTML = `
          <div class="quality-card-image-wrap">
            ${qualityProductActionsHtml(p, `/produto/${encodeURIComponent(p.slug || p.id)}/`)}
            ${productTagsHtml(p, 2)}
            <img src="${escapeHtml(productImagePath(p.image || 'images/sem-imagem.png'))}" alt="${escapeHtml(p.name || '')}">
          </div>
          <h3>${escapeHtml(p.name || '')}</h3>
          ${productVariationsCardHtml(p)}
          ${precoHTML}
          ${detalhesHTML}
          <a href="https://wa.me/5555991407824?text=Olá!%20Vim%20através%20do%20site%20e%20tenho%20interesse%20em%20${encodeURIComponent(p.name || 'produto')}"
             class="btn" target="_blank">
             <i class="fa-brands fa-whatsapp"></i> Comprar no Whatsapp
          </a>
        `;
        track.appendChild(card);
      });
      qualityBindProductActions();
    })
    .catch(() => {
      document.getElementById('no-results').style.display = 'block';
    });
  </script>

  <script>
  // V8.0.1 - Busca reforçada na Home sem mexer no main.js
  (function(){
    if (window.__qualityHomeSearchFixReady) return;
    window.__qualityHomeSearchFixReady = true;

    function normalizeSearch(value) {
      return (value || '')
        .toString()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();
    }

    function showSearchMessage(text) {
      const noResults = document.getElementById('no-results');
      if (noResults) {
        noResults.textContent = text;
        noResults.style.display = 'block';
      } else {
        alert(text);
      }
    }

    function fetchJson(paths) {
      let lastError = null;
      return paths.reduce(function(promise, url){
        return promise.catch(function(){
          return fetch(url, { cache: 'no-store' }).then(function(res){
            if (!res.ok) throw new Error('Falha ao carregar ' + url);
            return res.json();
          }).catch(function(err){
            lastError = err;
            throw err;
          });
        });
      }, Promise.reject()).catch(function(){
        if (lastError) throw lastError;
        throw new Error('Arquivo JSON não encontrado.');
      });
    }

    function qualityHomeSearch(query) {
      const termo = normalizeSearch(query);
      const noResults = document.getElementById('no-results');
      const cards = document.querySelectorAll('.product-card');

      if (!termo) {
        cards.forEach(function(card){ card.style.display = 'flex'; });
        if (noResults) noResults.style.display = 'none';
        return;
      }

      Promise.all([
        fetchJson(['/content/products.json', '/site/content/products.json']).catch(function(){ return { items: [] }; }),
        fetchJson(['/content/categories.json', '/site/content/categories.json']).catch(function(){ return { items: [] }; })
      ]).then(function(results){
        const products = results[0].items || [];
        const categories = results[1].items || [];

        const product = products.find(function(p){
          if (!p || p.active === false) return false;
          const haystack = normalizeSearch([
            p.name, p.nome, p.slug, p.category, p.categoria,
            p.descriptionShort, p.descriptionLong
          ].filter(Boolean).join(' '));
          return haystack.includes(termo);
        });

        if (product) {
          const slug = product.slug || product.id;
          window.location.href = '/produto/' + encodeURIComponent(slug) + '/';
          return;
        }

        const category = categories.find(function(c){
          const haystack = normalizeSearch([c.name, c.nome, c.slug, c.id].filter(Boolean).join(' '));
          return haystack.includes(termo);
        });

        if (category && category.slug) {
          window.location.href = '/' + encodeURIComponent(category.slug) + '/';
          return;
        }

        let foundOnPage = false;
        cards.forEach(function(card){
          const title = normalizeSearch(card.querySelector('h3')?.textContent || card.textContent || '');
          const match = title.includes(termo);
          card.style.display = match ? 'flex' : 'none';
          if (match) foundOnPage = true;
        });

        if (foundOnPage) {
          if (noResults) noResults.style.display = 'none';
          return;
        }

        showSearchMessage('Nenhum produto encontrado.');
      }).catch(function(){
        showSearchMessage('Erro ao buscar produto.');
      });
    }

    function bindSearch() {
      const desktopInput = document.getElementById('search-input');
      const desktopBtn = document.getElementById('search-button');
      const mobileInput = document.getElementById('search-input-mobile');
      const mobileBtn = document.getElementById('search-button-mobile');

      function bind(input, btn) {
        if (!input || !btn || btn.dataset.qualityHomeSearchFixed === '1') return;
        btn.dataset.qualityHomeSearchFixed = '1';
        btn.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          qualityHomeSearch(input.value);
        }, true);
        input.addEventListener('keydown', function(e){
          if (e.key === 'Enter') {
            e.preventDefault();
            e.stopPropagation();
            qualityHomeSearch(input.value);
          }
        }, true);
      }

      bind(desktopInput, desktopBtn);
      bind(mobileInput, mobileBtn);
    }

    document.addEventListener('DOMContentLoaded', bindSearch);
    setTimeout(bindSearch, 300);
    setTimeout(bindSearch, 900);
    setTimeout(bindSearch, 1600);
  })();
  </script>

</body>
