<html><head>
    
  <script async="" src="https://www.googletagmanager.com/gtag/js?id=G-9HPD9XCELH"></script><script>

  <body>
    <header class="header">
      <div class="header-container">
        <!-- Logo -->
        <a href="index.html" class="logo-wrapper">
          <img src="images/logo.png" alt="Quality Celulares" class="logo">
        </a>

        <!-- Navegação Desktop -->
        <nav class="nav-desktop" id="nav-desktop">
          <a href="index.html">Início</a>
          <!-- categorias serão injetadas aqui -->
          
          
          <a href="categoria.html?slug=smartphones" class="cat-link">Smartphones</a><a href="categoria.html?slug=acessorios" class="cat-link">Acessórios</a><div class="search-wrapper">
            <input type="text" id="search-input" placeholder="Buscar...">
            <button id="search-button" aria-label="Buscar">
              <i class="fa fa-search"></i>
            </button>
          </div>
        </nav>

        <!-- Botão Mobile -->
        <button id="menu-toggle" class="menu-toggle" aria-label="Abrir menu">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>

      <!-- Menu Mobile -->
      <div id="mobile-menu" class="mobile-menu" aria-hidden="true">
        <div class="mobile-menu-header">
          <a href="index.html" class="logo-wrapper">
            <img src="images/logo.png" alt="Quality Celulares" class="logo">
          </a>
          <button id="menu-close" class="menu-close" aria-label="Fechar menu">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Busca Mobile -->
        <div class="search-wrapper-mobile">
          <input type="text" id="search-input-mobile" placeholder="Buscar...">
          <button id="search-button-mobile" aria-label="Buscar">
            <i class="fa fa-search"></i>
          </button>
        </div>

        <!-- Navegação Mobile -->
        <nav class="mobile-nav" id="nav-mobile">
          <a href="index.html">Início</a>
          <!-- categorias serão injetadas aqui -->
          
          
        <a href="categoria.html?slug=smartphones" class="cat-link">Smartphones</a><a href="categoria.html?slug=acessorios" class="cat-link">Acessórios</a></nav>
      </div>

      <!-- Overlay -->
      <div id="menu-overlay" class="menu-overlay"></div>
    </header>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        fetch("/content/categories.json")
          .then(r => r.json())
          .then(data => {
            const categorias = data.items || [];
            const navDesktop = document.getElementById("nav-desktop");
            const navMobile = document.getElementById("nav-mobile");
            if (!navDesktop || !navMobile) return;

            navDesktop.querySelectorAll("a.cat-link").forEach(a => a.remove());
            navMobile.querySelectorAll("a.cat-link").forEach(a => a.remove());

            const searchWrapper = navDesktop.querySelector(".search-wrapper");

            categorias
              .sort((a, b) => (a.order || 0) - (b.order || 0))
              .forEach(cat => {
                const linkD = document.createElement("a");
                linkD.href = `categoria.html?slug=${encodeURIComponent(cat.slug)}`;
                if (cat.icon) {
                  const iconD = document.createElement("i");
                  iconD.className = cat.icon;
                  iconD.setAttribute("aria-hidden", "true");
                  linkD.appendChild(iconD);
                  linkD.appendChild(document.createTextNode(" "));
                }
                linkD.appendChild(document.createTextNode(cat.name));
                linkD.className = "cat-link";
                if (searchWrapper)
                  navDesktop.insertBefore(linkD, searchWrapper);
                else navDesktop.appendChild(linkD);

                const linkM = document.createElement("a");
                linkM.href = `categoria.html?slug=${encodeURIComponent(cat.slug)}`;
                if (cat.icon) {
                  const iconM = document.createElement("i");
                  iconM.className = cat.icon;
                  iconM.setAttribute("aria-hidden", "true");
                  linkM.appendChild(iconM);
                  linkM.appendChild(document.createTextNode(" "));
                }
                linkM.appendChild(document.createTextNode(cat.name));
                linkM.className = "cat-link";
                navMobile.appendChild(linkM);
              });
          })
          .catch(err => console.error("Erro ao carregar categorias:", err));

        // Menu mobile
        const toggle = document.getElementById("menu-toggle");
        const close = document.getElementById("menu-close");
        const menu = document.getElementById("mobile-menu");
        const overlay = document.getElementById("menu-overlay");

        if (toggle && menu && overlay) {
          const abrir = () => {
            menu.classList.add("open");
            overlay.classList.add("show");
            menu.setAttribute("aria-hidden", "false");
          };
          const fechar = () => {
            menu.classList.remove("open");
            overlay.classList.remove("show");
            menu.setAttribute("aria-hidden", "true");
          };
          toggle.addEventListener("click", abrir);
          close?.addEventListener("click", fechar);
          overlay.addEventListener("click", fechar);
        }
      });
    </script>
  

</body></html>
