<script>
(function(){
  function escapeHtml(value){
    return (value || '').toString()
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  window.qualityUpdateFavoriteButtons = qualityUpdateFavoriteButtons;

  function nl2br(value){
    return escapeHtml(value).replace(/\n/g, '<br>');
  }





  /* V8.1.1 - Favoritos e Compartilhar sem login */
  function qualityProductKey(p){
    return String(p?.slug || p?.id || p?._id || p?.url || p?.name || p?.nome || '').trim().toLowerCase();
  }

  function qualityCleanUrl(url){
    if (!url || url === '#') return window.location.href;
    try { return new URL(url, window.location.origin).href; }
    catch { return window.location.href; }
  }

  function qualityProductPayloadFromButton(btn){
    return {
      id: btn.getAttribute('data-id') || '',
      slug: btn.getAttribute('data-slug') || '',
      name: btn.getAttribute('data-name') || 'Produto',
      image: btn.getAttribute('data-image') || '',
      url: qualityCleanUrl(btn.getAttribute('data-url') || '')
    };
  }

  function qualityReadStorage(key){
    try { return JSON.parse(localStorage.getItem(key) || '[]'); }
    catch { return []; }
  }

  function qualityWriteStorage(key, items){
    try { localStorage.setItem(key, JSON.stringify(items)); } catch {}
  }

  function qualityFavoriteKey(){ return 'quality_favoritos_v811'; }
  function qualityRecentKey(){ return 'quality_vistos_recentemente_v811'; }

  function qualityIsFavorite(id){
    const key = String(id || '').trim().toLowerCase();
    if (!key) return false;
    return qualityReadStorage(qualityFavoriteKey()).some(item => {
      const itemKey = qualitySavedProductKey(item);
      return itemKey === key || String(item.id || item.slug || item.url || item.name || '').trim().toLowerCase() === key;
    });
  }

  function qualityToggleFavorite(product){
    const id = String(product.slug || product.id || '').trim();
    const key = qualitySavedProductKey(product);
    if (!id && !key) return false;
    let items = qualityReadStorage(qualityFavoriteKey());
    const exists = items.some(item => {
      const itemKey = qualitySavedProductKey(item);
      return itemKey === key || String(item.id || item.slug || '') === id;
    });
    if (exists) {
      items = items.filter(item => {
        const itemKey = qualitySavedProductKey(item);
        return itemKey !== key && String(item.id || item.slug || '') !== id;
      });
    } else {
      items.unshift({ ...product, id: product.id || id || key, slug: product.slug || id || key, savedAt: Date.now() });
    }
    qualityWriteStorage(qualityFavoriteKey(), items.slice(0, 60));
    return !exists;
  }

  function qualitySavedProductKey(item){
    return String(item?.slug || item?.id || item?.url || item?.name || '').trim().toLowerCase();
  }

  function qualitySaveRecent(product){
    const id = String(product.slug || product.id || '').trim();
    const key = qualitySavedProductKey(product);
    if (!id && !key) return;
    let items = qualityReadStorage(qualityRecentKey()).filter(item => {
      const itemKey = qualitySavedProductKey(item);
      return itemKey && itemKey !== key && String(item.id || item.slug || '') !== id;
    });
    items.unshift({ ...product, id: product.id || id || key, slug: product.slug || id || key, viewedAt: Date.now() });
    qualityWriteStorage(qualityRecentKey(), items.slice(0, 20));
  }

  function qualityToast(message){
    try {
      let el = document.querySelector('.quality-fav-toast');
      if (!el) {
        el = document.createElement('div');
        el.className = 'quality-fav-toast';
        document.body.appendChild(el);
      }
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(window.__qualityFavToastTimer);
      window.__qualityFavToastTimer = setTimeout(() => el.classList.remove('show'), 1600);
    } catch {}
  }

  function qualityUpdateFavoriteButtons(){
    document.querySelectorAll('[data-quality-fav]').forEach(btn => {
      const probe = btn.getAttribute('data-slug') || btn.getAttribute('data-id') || btn.getAttribute('data-url') || btn.getAttribute('data-name') || '';
      const active = qualityIsFavorite(probe);
      btn.classList.toggle('is-active', active);
      btn.setAttribute('aria-label', active ? 'Remover dos favoritos' : 'Favoritar produto');
      btn.setAttribute('title', active ? 'Remover dos favoritos' : 'Favoritar');
      if (btn.classList.contains('quality-detail-action')) {
        btn.innerHTML = active ? '<i class="fa-solid fa-heart"></i> Favoritado' : '<i class="fa-regular fa-heart"></i> Favoritar';
      } else {
        btn.innerHTML = active ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
      }
    });
  }

  async function qualityShareProduct(product){
    const title = product.name || 'Produto Quality Celulares';
    const url = qualityCleanUrl(product.url || '');
    const text = 'Olha este produto da Quality Celulares: ' + title;
    if (navigator.share) {
      try { await navigator.share({ title, text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try {
      await navigator.clipboard.writeText(url);
      alert('Link do produto copiado!');
    } catch {
      window.prompt('Copie o link do produto:', url);
    }
  }

  function qualityProductActionsHtml(p, url){
    const name = p.name || p.nome || 'Produto';
    const img = p.image || p.imagem || 'images/sem-imagem.png';
    const slug = p.slug || p.id || p._id || '';
    const id = p.id || slug;
    const detailUrl = url || (slug ? '/produto/' + encodeURIComponent(slug) + '/' : window.location.href);
    return '<div class="quality-card-actions">' +
      '<button type="button" class="quality-card-action quality-favorite-btn" data-quality-fav data-id="' + escapeHtml(id) + '" data-slug="' + escapeHtml(slug) + '" data-name="' + escapeHtml(name) + '" data-image="' + escapeHtml(img) + '" data-url="' + escapeHtml(detailUrl) + '" aria-label="Favoritar produto" title="Favoritar"><i class="fa-regular fa-heart"></i></button>' +
      '<button type="button" class="quality-card-action quality-share-btn" data-quality-share data-id="' + escapeHtml(id) + '" data-slug="' + escapeHtml(slug) + '" data-name="' + escapeHtml(name) + '" data-image="' + escapeHtml(img) + '" data-url="' + escapeHtml(detailUrl) + '" aria-label="Compartilhar produto" title="Compartilhar"><i class="fa-solid fa-share-nodes"></i></button>' +
    '</div>';
  }

  function qualityBindProductActions(){
    if (window.__qualityProductActionsBoundV8112) { qualityUpdateFavoriteButtons(); return; }
    window.__qualityProductActionsBoundV8112 = true;
    document.addEventListener('click', function(ev){
      const fav = ev.target.closest('[data-quality-fav]');
      const share = ev.target.closest('[data-quality-share]');
      if (!fav && !share) return;
      ev.preventDefault();
      ev.stopPropagation();
      const btn = fav || share;
      const product = qualityProductPayloadFromButton(btn);
      if (fav) {
        const active = qualityToggleFavorite(product);
        qualityUpdateFavoriteButtons();
        btn.classList.add('quality-action-pulse');
        qualityToast(active ? 'Produto adicionado aos favoritos ❤️' : 'Produto removido dos favoritos');
        setTimeout(() => btn.classList.remove('quality-action-pulse'), 260);
      } else {
        qualityShareProduct(product);
      }
    }, true);
    qualityUpdateFavoriteButtons();
    if (window.qualityRefreshFavoritesMenu) { try { window.qualityRefreshFavoritesMenu(); } catch(e){} }
  }

  function productTagInfo(tag){
    const label = String(tag || '').trim();
    const key = normalizeText(label);
    if (key.includes('oferta')) return { label, cls:'oferta', icon:'fa-solid fa-fire' };
    if (key.includes('lancamento') || key.includes('lançamento')) return { label, cls:'lancamento', icon:'fa-solid fa-rocket' };
    if (key.includes('mais vendido') || key.includes('vendido')) return { label, cls:'mais-vendido', icon:'fa-solid fa-star' };
    if (key.includes('ultima') || key.includes('última')) return { label, cls:'ultimas', icon:'fa-solid fa-bolt' };
    if (key.includes('preco') || key.includes('preço') || key.includes('baixou')) return { label, cls:'preco-baixou', icon:'fa-solid fa-tags' };
    if (key.includes('frete')) return { label, cls:'frete', icon:'fa-solid fa-truck-fast' };
    if (key.includes('novo') || key.includes('novidade')) return { label, cls:'novo', icon:'fa-solid fa-sparkles' };
    if (key.includes('seminovo')) return { label, cls:'seminovo', icon:'fa-solid fa-shield-halved' };
    return { label, cls:'padrao', icon:'fa-solid fa-tag' };
  }


  function qualityCompactCardTagLabel(label){
    const text = String(label || '').trim();
    const key = normalizeText(text);
    if (key.includes('ultima') || key.includes('última')) return 'Últimas unidades';
    if (key.includes('lancamento') || key.includes('lançamento')) return 'Lançamento';
    if (key.includes('mais vendido') || key.includes('vendido')) return 'Mais vendido';
    if (key.includes('preco') || key.includes('preço') || key.includes('baixou')) return 'Preço baixou';
    return text;
  }

  function productTagsHtml(p, limit, mode){
    const tags = Array.isArray(p.tags) ? p.tags : String(p.tags || '').split(/\r?\n|,/);
    const clean = tags.map(t => String(t || '').trim()).filter(Boolean).slice(0, limit || 6);
    if (!clean.length) return '';
    const cls = mode === 'overlay' ? 'quality-card-tags premium-card-tags' : 'produto-tags premium-detail-tags';
    return '<div class="' + cls + '">' + clean.map(t => {
      const info = productTagInfo(t);
      return '<span class="quality-product-tag tag-' + info.cls + '"><i class="' + info.icon + '"></i>' + escapeHtml(mode === 'overlay' && typeof qualityCompactCardTagLabel === 'function' ? qualityCompactCardTagLabel(info.label) : info.label) + '</span>';
    }).join('') + '</div>';
  }

  function productUrl(p){
    const slug = p.slug || p.id || '';
    return slug ? '/produto/' + encodeURIComponent(slug) + '/' : '#';
  }

  function productTokens(name){
    return normalizeText(name || '')
      .split(/[^a-z0-9]+/)
      .filter(t => t.length >= 3 && !['com','para','novo','nova','gb','ram','tela','preto','branco','azul','verde','rosa'].includes(t));
  }

  function listField(value){
    if (Array.isArray(value)) return value.map(v => String(v || '').trim()).filter(Boolean);
    return String(value || '').split(/\r?\n|,|;/).map(v => v.trim()).filter(Boolean);
  }

  function qltCode(id){
    const raw = String(id || '').replace(/\D/g, '');
    return raw ? raw.slice(-6).padStart(6, '0') : '';
  }

  function sameProduct(a, b){
    return String(a?.id || '') === String(b?.id || '') || String(a?.slug || '') === String(b?.slug || '');
  }

  function findProductsByRefs(refs, allProducts, current){
    const result = [];
    listField(refs).forEach(ref => {
      const clean = String(ref || '').trim().replace(/^QLT[-\s]*/i, '').toLowerCase();
      if (!clean) return;
      const found = (allProducts || []).find(p => {
        const id = String(p.id || '').toLowerCase();
        const slug = String(p.slug || '').toLowerCase();
        const code = qltCode(p.id).toLowerCase();
        return id === clean || slug === clean || code === clean || ('qlt-' + code) === clean;
      });
      if (found && found.active !== false && !sameProduct(found, current) && !result.some(p => sameProduct(p, found))) result.push(found);
    });
    return result;
  }

  function brandOfProduct(p){
    const n = normalizeText(p?.name || p?.nome || '');
    if (n.includes('iphone') || n.includes('apple')) return 'apple';
    if (n.includes('samsung') || n.includes('galaxy')) return 'samsung';
    if (n.includes('xiaomi') || n.includes('redmi') || n.includes('poco')) return 'xiaomi';
    if (n.includes('motorola') || n.includes('moto ')) return 'motorola';
    if (n.includes('jbl')) return 'jbl';
    if (n.includes('alexa') || n.includes('echo')) return 'amazon';
    return '';
  }

  function hasTag(p, word){
    const tags = Array.isArray(p.tags) ? p.tags : String(p.tags || '').split(/\r?\n|,/);
    return tags.some(t => normalizeText(t).includes(normalizeText(word)));
  }

  function relatedScore(current, candidate){
    if (!candidate || candidate.active === false || sameProduct(candidate, current)) return -1;
    let score = 0;
    if ((candidate.category || '') === (current.category || '')) score += 40;
    if (brandOfProduct(candidate) && brandOfProduct(candidate) === brandOfProduct(current)) score += 35;
    const a = new Set(productTokens(current.name || ''));
    const b = new Set(productTokens(candidate.name || ''));
    a.forEach(t => { if (b.has(t)) score += 12; });
    if (candidate.featured) score += 8;
    if (hasTag(candidate, 'lançamento') || hasTag(candidate, 'lancamento') || hasTag(candidate, 'mais vendido')) score += 8;
    if (candidate.detailsEnabled) score += 3;
    return score;
  }

  function productMiniCardHtml(p){
    const n = p.name || p.nome || 'Produto';

  function accessoryScore(current, candidate){
    if (!candidate || candidate.active === false || sameProduct(candidate, current)) return -1;
    const cName = normalizeText(candidate.name || candidate.nome || '');
    const currentName = normalizeText(current.name || current.nome || '');
    const currentCategory = normalizeText(current.category || '');
    const candidateCategory = normalizeText(candidate.category || '');
    if (candidateCategory.includes('assistencia') || cName.includes('troca de') || cName.includes('assistencia')) return -1;

    let score = 0;
    const isSmartphone = currentCategory.includes('smart') || /iphone|galaxy|redmi|poco|moto/.test(currentName);
    const isGame = /playstation|ps4|ps5|xbox|nintendo/.test(currentName);
    const isNotebook = /notebook|macbook|laptop/.test(currentName);
    const isAlexa = /alexa|echo/.test(currentName);
    const isWatch = /smartwatch|relogio|relógio|amazfit|watch/.test(currentName);

    if (isSmartphone) {
      if (/pelicula|película|capinha|capa|case/.test(cName)) score += 80;
      if (/carregador|fonte|cabo|usb|power bank|fone|jbl|bluetooth/.test(cName)) score += 55;
      if (brandOfProduct(candidate) && brandOfProduct(candidate) === brandOfProduct(current)) score += 15;
    }
    if (isGame && /controle|headset|fone|carregador|jogo|base/.test(cName)) score += 70;
    if (isNotebook && /mouse|teclado|mochila|suporte|base|ssd|hub|cabo/.test(cName)) score += 70;
    if (isAlexa && /lampada|lâmpada|tomada|smart plug|camera|câmera/.test(cName)) score += 70;
    if (isWatch && /pulseira|pelicula|película|carregador|cabo/.test(cName)) score += 70;

    if (candidate.featured) score += 8;
    if (candidateCategory.includes('acessorio') || candidateCategory.includes('acessório')) score += 10;
    return score;
  }

      const found = (allProducts || []).find(p => {
        const keys = [p.slug, p.id, p._id, productUrl(p), p.name, p.nome].map(v => String(v || '').trim().toLowerCase()).filter(Boolean);

      const key = qualitySavedProductKey({ slug: found.slug, id: found.id, url: productUrl(found), name: found.name || found.nome });

      seen.add(key);

  function safeDescriptionHtml(value){
    const allowed = ['B','STRONG','I','EM','BR','P','DIV','UL','OL','LI','H3','H4'];
    const tpl = document.createElement('template');
    tpl.innerHTML = value || '';
    tpl.content.querySelectorAll('*').forEach(el => {
      if (!allowed.includes(el.tagName)) {
        el.replaceWith(document.createTextNode(el.textContent || ''));
        return;
      }
      Array.from(el.attributes).forEach(attr => el.removeAttribute(attr.name));
    });
    const html = tpl.innerHTML.trim();
    return html || nl2br(value || '');
  }

  function formatPrice(value){
    const priceNum = (typeof value === 'number' ? value : Number(value || 0));
    if (isNaN(priceNum)) return '';
    return 'R$ ' + priceNum.toFixed(2).replace('.', ',');
  }

  function parsePriceForSchema(value){
    if (value === null || value === undefined || value === '') return null;

    if (typeof value === 'number') {
      return value > 0 ? value.toFixed(2) : null;
    }

    let raw = value.toString().trim();
    if (!raw) return null;

    raw = raw.replace(/[^0-9,\.]/g, '');

    if (raw.includes(',') && raw.includes('.')) {
      raw = raw.replace(/\./g, '').replace(',', '.');
    } else if (raw.includes(',')) {
      raw = raw.replace(',', '.');
    }

    const priceNum = Number(raw);
    return !isNaN(priceNum) && priceNum > 0 ? priceNum.toFixed(2) : null;
  }

  function isYoutube(url){
    return /youtube\.com|youtu\.be/i.test(url || '');

  function youtubeEmbed(url){
    if (!url) return '';

    let videoId = '';

    if (url.includes('youtu.be/')) {
      videoId = url.split('youtu.be/')[1].split(/[?&]/)[0];
    } else if (url.includes('watch?v=')) {
      videoId = url.split('watch?v=')[1].split('&')[0];
    } else if (url.includes('/shorts/')) {
      videoId = url.split('/shorts/')[1].split(/[?&]/)[0];
    } else if (url.includes('/embed/')) {
      videoId = url.split('/embed/')[1].split(/[?&]/)[0];
    }

    return videoId ? 'https://www.youtube.com/embed/' + videoId : '';
  }

    if (!value) return {};
    if (typeof value === 'object' && !Array.isArray(value)) return value;

  }

  function normalizeVariations(product){
    const v = product.variations || {};
    const colors = Array.isArray(v.colors) ? v.colors : lines(v.colorsText).map(line => {
      const parts = line.split('|').map(p => p.trim());
      return { name: parts[0] || '', hex: parts[1] || '', image: parts[2] || '' };
    }).filter(c => c.name);
    return {
      enabled: v.enabled === true || v.enabled === 'true',
      colors,
      storage: Array.isArray(v.storage) ? v.storage : lines(v.storageText),
      ram: Array.isArray(v.ram) ? v.ram : lines(v.ramText),
      condition: Array.isArray(v.condition) ? v.condition : lines(v.conditionText),
      labels: parseVariationLabels(v.labels || v.labelsText),
      combinations: Array.isArray(v.combinations) ? v.combinations : lines(v.combinationsText).map(line => { const parts = line.split('|').map(p => p.trim()); return { color: parts[0] || '', storage: parts[1] || '', ram: parts[2] || '', condition: parts[3] || '', image: parts[4] || '', stock: parts[5] !== undefined && parts[5] !== '' ? Number(parts[5]) : null }; }).filter(c => c.color || c.storage || c.ram || c.condition)

        if (!value) return;
        const buttons = Array.from(document.querySelectorAll('.produto-variacao-btn[data-var-type="' + type + '"]'));
        const found = buttons.find(b => (b.getAttribute('data-var-value') || b.textContent.trim()) === value);
        if (!found) return;
        buttons.forEach(b => b.classList.remove('ativa'));
        found.classList.add('ativa');
      }

      function updateMainImageByVariation(imageVariation, fallbackButton) {
        if (!principal) return;
        if (!imageVariation && fallbackButton) {
          const colorButtons = Array.from(document.querySelectorAll('.produto-variacao-btn[data-var-type="colors"]'));
          const colorIndex = colorButtons.indexOf(fallbackButton);
          imageVariation = medias[colorIndex] || '';
        }
        if (imageVariation) {
          principal.innerHTML = `<img src="${escapeHtml(imageVariation)}" alt="${escapeHtml(name)}">`;
          document.querySelectorAll('.galeria-thumb').forEach((thumb, thumbIndex) => {
            thumb.classList.toggle('ativa', medias[thumbIndex] === imageVariation);
          });
        }
      }

      function applyCombinationFromClick(type, clickedBtn) {
        const combos = Array.isArray(variacoesNormalizadas.combinations) ? variacoesNormalizadas.combinations : [];
        if (!combos.length) return false;
        const clickedValue = clickedBtn.getAttribute('data-var-value') || clickedBtn.textContent.trim();
        const selected = {
          color: getSelectedVariationValue('colors'),
          storage: getSelectedVariationValue('storage'),
          ram: getSelectedVariationValue('ram'),
          condition: getSelectedVariationValue('condition')
        };
        const keyMap = { colors: 'color', storage: 'storage', ram: 'ram', condition: 'condition' };
        selected[keyMap[type]] = clickedValue;
        const combo = combos.find(c => {
          if (selected.color && c.color && c.color !== selected.color) return false;
          if (selected.storage && c.storage && c.storage !== selected.storage) return false;
          if (selected.ram && c.ram && c.ram !== selected.ram) return false;
          if (selected.condition && c.condition && c.condition !== selected.condition) return false;
          return true;
        }) || combos.find(c => c[keyMap[type]] === clickedValue);
        if (!combo) return false;
        activateVariationButton('colors', combo.color);
        activateVariationButton('storage', combo.storage);
        activateVariationButton('ram', combo.ram);
        activateVariationButton('condition', combo.condition);
        const activeColorBtn = document.querySelector('.produto-variacao-btn[data-var-type="colors"].ativa');
        updateMainImageByVariation(combo.image ? assetPath(combo.image) : (activeColorBtn?.getAttribute('data-image') || ''), activeColorBtn);
        return true;
      }

      document.querySelectorAll('.produto-variacao-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const type = btn.getAttribute('data-var-type');
          document.querySelectorAll('.produto-variacao-btn[data-var-type="' + type + '"]').forEach(b => b.classList.remove('ativa'));
          btn.classList.add('ativa');
          const usedCombo = applyCombinationFromClick(type, btn);
          if (!usedCombo && type === 'colors') {
            updateMainImageByVariation(btn.getAttribute('data-image'), btn);
          }
        });
      });

      document.querySelectorAll('.galeria-thumb').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.galeria-thumb').forEach(b => b.classList.remove('ativa'));
          btn.classList.add('ativa');

          const media = btn.getAttribute('data-media');

          if (isYoutube(media)) {
            const embed = youtubeEmbed(media);
            principal.innerHTML = embed
              ? `<iframe src="${escapeHtml(embed)}" allowfullscreen></iframe>`
              : '<p>Vídeo inválido.</p>';
          } else {
            principal.innerHTML = `<img src="${escapeHtml(media)}" alt="${escapeHtml(name)}">`;
          }
        });
      });

      /* Quality V8.4 - Zoom desktop estilo marketplace + visualizador mobile */
      function initQualityProductGalleryZoom(){
        if (!principal || principal.__qualityZoomReady) return;
        principal.__qualityZoomReady = true;

        const galleryRoot = principal.closest('.produto-galeria');
        const finePointer = window.matchMedia('(hover: hover) and (pointer: fine) and (min-width: 901px)');
        let lens = null;
        let result = null;
        let observer = null;

        function currentImage(){ return principal.querySelector('img'); }
        function imageSources(){
          return Array.from(document.querySelectorAll('.galeria-thumb[data-media]'))
            .map(btn => btn.getAttribute('data-media') || '')
            .filter(src => src && !isYoutube(src));
        }
        function currentImageIndex(){
          const img = currentImage();
          const sources = imageSources();
          const src = img ? (img.getAttribute('src') || '') : '';
          const idx = sources.indexOf(src);
          return idx >= 0 ? idx : 0;
        }

        function ensureDesktopParts(){
          if (!galleryRoot) return;
          if (!lens) {
            lens = document.createElement('span');
            lens.className = 'quality-zoom-lens';
            lens.setAttribute('aria-hidden', 'true');
            principal.appendChild(lens);
          }
          if (!result) {
            result = document.createElement('div');
            result.className = 'quality-zoom-result';
            result.setAttribute('aria-hidden', 'true');
            galleryRoot.appendChild(result);
          }
        }

        function deactivateDesktopZoom(){
          galleryRoot?.classList.remove('quality-zoom-active');
        }

        function refreshZoomState(){
          const img = currentImage();
          const zoomable = !!img;
          principal.classList.toggle('is-zoomable', zoomable);
          principal.querySelector('.quality-mobile-zoom-hint')?.remove();
          if (zoomable) {
            const hint = document.createElement('span');
            hint.className = 'quality-mobile-zoom-hint';
            hint.innerHTML = '<i class="fa-solid fa-magnifying-glass-plus"></i> Toque para ampliar';
            principal.appendChild(hint);
          }
          deactivateDesktopZoom();
        }

        function moveDesktopZoom(ev){
          if (!finePointer.matches) return;
          const img = currentImage();
          if (!img || !galleryRoot) return;
          ensureDesktopParts();

          const rect = img.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          let x = ev.clientX - rect.left;
          let y = ev.clientY - rect.top;
          if (x < 0 || y < 0 || x > rect.width || y > rect.height) {
            deactivateDesktopZoom();
            return;
          }

          const lensW = Math.min(rect.width * .38, 190);
          const lensH = Math.min(rect.height * .38, 190);
          lens.style.width = lensW + 'px';
          lens.style.height = lensH + 'px';

          let left = x - lensW / 2;
          let top = y - lensH / 2;
          left = Math.max(0, Math.min(left, rect.width - lensW));
          top = Math.max(0, Math.min(top, rect.height - lensH));

          const principalRect = principal.getBoundingClientRect();
          lens.style.left = (rect.left - principalRect.left + left) + 'px';
          lens.style.top = (rect.top - principalRect.top + top) + 'px';

          const px = rect.width > lensW ? (left / (rect.width - lensW)) * 100 : 50;
          const py = rect.height > lensH ? (top / (rect.height - lensH)) * 100 : 50;
          result.style.backgroundImage = 'url("' + img.currentSrc.replace(/"/g, '%22') + '")';
          result.style.backgroundSize = '250% 250%';
          result.style.backgroundPosition = px + '% ' + py + '%';
          galleryRoot.classList.add('quality-zoom-active');
        }

        principal.addEventListener('mousemove', moveDesktopZoom);
        principal.addEventListener('mouseenter', moveDesktopZoom);
        principal.addEventListener('mouseleave', deactivateDesktopZoom);
        finePointer.addEventListener?.('change', deactivateDesktopZoom);

        let viewer = null;
        let viewerImg = null;
        let viewerCounter = null;
        let viewerIndex = 0;
        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let pointers = new Map();
        let pinchStartDistance = 0;
        let pinchStartScale = 1;
        let panStart = null;
        let swipeStartX = 0;
        let swipeStartY = 0;

        function ensureViewer(){
          if (viewer) return;
          viewer = document.createElement('div');
          viewer.className = 'quality-gallery-viewer';
          viewer.setAttribute('role', 'dialog');
          viewer.setAttribute('aria-modal', 'true');
          viewer.setAttribute('aria-label', 'Galeria ampliada do produto');
          viewer.innerHTML = `
            <div class="quality-gallery-viewer-head">
              <span class="quality-gallery-viewer-counter"></span>
              <button type="button" class="quality-gallery-viewer-close" aria-label="Fechar">×</button>
            </div>
            <div class="quality-gallery-viewer-stage">
              <button type="button" class="quality-gallery-viewer-nav quality-gallery-viewer-prev" aria-label="Imagem anterior">‹</button>
              <img class="quality-gallery-viewer-image" alt="${escapeHtml(name)}">
              <button type="button" class="quality-gallery-viewer-nav quality-gallery-viewer-next" aria-label="Próxima imagem">›</button>
            </div>
            <div class="quality-gallery-viewer-help">Use dois dedos para ampliar • deslize para trocar de foto</div>`;
          document.body.appendChild(viewer);
          viewerImg = viewer.querySelector('.quality-gallery-viewer-image');
          viewerCounter = viewer.querySelector('.quality-gallery-viewer-counter');
          const stage = viewer.querySelector('.quality-gallery-viewer-stage');

          viewer.querySelector('.quality-gallery-viewer-close').addEventListener('click', closeViewer);
          viewer.querySelector('.quality-gallery-viewer-prev').addEventListener('click', () => showViewerImage(viewerIndex - 1));
          viewer.querySelector('.quality-gallery-viewer-next').addEventListener('click', () => showViewerImage(viewerIndex + 1));

          stage.addEventListener('pointerdown', ev => {
            pointers.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
            stage.setPointerCapture?.(ev.pointerId);
            if (pointers.size === 1) {
              panStart = {x:ev.clientX, y:ev.clientY, tx:translateX, ty:translateY};
              swipeStartX = ev.clientX;
              swipeStartY = ev.clientY;
            } else if (pointers.size === 2) {
              const pts = Array.from(pointers.values());
              pinchStartDistance = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
              pinchStartScale = scale;
            }
          });

          stage.addEventListener('pointermove', ev => {
            if (!pointers.has(ev.pointerId)) return;
            pointers.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
            if (pointers.size === 2) {
              const pts = Array.from(pointers.values());
              const distance = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
              if (pinchStartDistance) scale = Math.max(1, Math.min(4, pinchStartScale * distance / pinchStartDistance));
              if (scale === 1) { translateX = 0; translateY = 0; }
              applyViewerTransform();
            } else if (pointers.size === 1 && scale > 1 && panStart) {
              translateX = panStart.tx + ev.clientX - panStart.x;
              translateY = panStart.ty + ev.clientY - panStart.y;
              applyViewerTransform();
            }
          });

          function endPointer(ev){
            const wasSingle = pointers.size === 1;
            pointers.delete(ev.pointerId);
            if (wasSingle && scale === 1) {
              const dx = ev.clientX - swipeStartX;
              const dy = ev.clientY - swipeStartY;
              if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.2) showViewerImage(viewerIndex + (dx < 0 ? 1 : -1));
            }
            if (!pointers.size) panStart = null;
          }
          stage.addEventListener('pointerup', endPointer);
          stage.addEventListener('pointercancel', endPointer);

          viewerImg.addEventListener('dblclick', () => {
            scale = scale > 1 ? 1 : 2;
            translateX = translateY = 0;
            applyViewerTransform();
          });
        }

        function applyViewerTransform(){
          if (!viewerImg) return;
          if (scale <= 1) { scale = 1; translateX = 0; translateY = 0; }
          viewerImg.style.transform = `translate3d(${translateX}px,${translateY}px,0) scale(${scale})`;
        }

        function resetViewerTransform(){
          scale = 1; translateX = 0; translateY = 0; pointers.clear();
          applyViewerTransform();
        }

        function showViewerImage(index){
          const sources = imageSources();
          if (!sources.length) return;
          viewerIndex = (index + sources.length) % sources.length;
          resetViewerTransform();
          viewerImg.src = sources[viewerIndex];
          viewerCounter.textContent = (viewerIndex + 1) + ' / ' + sources.length;
          const showNav = sources.length > 1;
          viewer.querySelectorAll('.quality-gallery-viewer-nav').forEach(btn => btn.style.display = showNav ? 'inline-flex' : 'none');
        }

        function openViewer(){
          if (finePointer.matches || !currentImage()) return;
          ensureViewer();
          showViewerImage(currentImageIndex());
          viewer.classList.add('is-open');
          document.body.classList.add('quality-gallery-viewer-open');
        }

        function closeViewer(){
          viewer?.classList.remove('is-open');
          document.body.classList.remove('quality-gallery-viewer-open');
          resetViewerTransform();
        }

        principal.addEventListener('click', ev => {
          if (ev.target.closest('iframe')) return;
          openViewer();
        });
        document.addEventListener('keydown', ev => {
          if (!viewer?.classList.contains('is-open')) return;
          if (ev.key === 'Escape') closeViewer();
          if (ev.key === 'ArrowLeft') showViewerImage(viewerIndex - 1);
          if (ev.key === 'ArrowRight') showViewerImage(viewerIndex + 1);
        });

        observer = new MutationObserver(mutations => {
          const mediaChanged = mutations.some(mutation => {
            const nodes = [...mutation.addedNodes, ...mutation.removedNodes];
            return nodes.some(node =>
              node && node.nodeType === 1 &&
              (node.matches?.('img, iframe') || node.querySelector?.('img, iframe'))
            );
          });
          if (mediaChanged) refreshZoomState();
        });
        observer.observe(principal, {childList:true, subtree:false});
        refreshZoomState();
      }

      initQualityProductGalleryZoom();

    })
    .catch(() => {
      box.innerHTML = '<p class="em-breve" style="text-align:center;">Erro ao carregar produto.</p>';
    });
})();
</script>

<script>
/* Quality V8.2.2.4 - Menu Favoritos global + remover todos */
(function(){
  if (window.__qualityFavoritesMenuGlobalV8224) return;
  window.__qualityFavoritesMenuGlobalV8224 = true;

  var KEY = 'quality_favoritos_v811';
  var refreshTimers = [];

  function productKey(item){
    return String((item && (item.slug || item.id || item.url || item.name || item.nome)) || '').trim().toLowerCase();
  }

  function readFavorites(){
    try {
      var raw = JSON.parse(localStorage.getItem(KEY) || '[]');
      if (!Array.isArray(raw)) return [];
      var seen = {};
      return raw.filter(function(item){
        var k = productKey(item);
        if (!k || seen[k]) return false;
        seen[k] = true;
        return true;
      });
    } catch(e){ return []; }
  }

  function writeFavorites(items){
    try { localStorage.setItem(KEY, JSON.stringify(items || [])); } catch(e){}
  }

  function esc(v){
    return String(v || '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

  function productUrl(item){
    var u = item && item.url ? item.url : (item && item.slug ? '/produto/' + encodeURIComponent(item.slug) + '/' : '#');
    try { return new URL(u, window.location.origin).href; } catch(e){ return '#'; }
  }

  function productImg(item){
    var p = String((item && (item.image || item.imagem)) || '').trim();
    if (!p) return '/images/sem-imagem.png';
    if (/^https?:\/\//i.test(p)) return p;
    return '/' + p.replace(/^\/+/, '').replace(/^site\//, '');
  }

  function menuHtml(count){
    return '<i class="fa-solid fa-heart"></i><span>Favoritos</span><span class="quality-favorites-count">' + count + '</span>';
  }

  function findSearchInside(nav){
    if (!nav) return null;
    return nav.querySelector('.search-wrapper, .search-wrapper-mobile');
  }

  function ensureMenu(){
    var items = readFavorites();
    var count = items.length;

    document.querySelectorAll('[data-quality-open-favorites-menu]').forEach(function(link){
      if (!count) link.remove();
    });

    if (!count) {
      closePanel();
      return;
    }

    ['nav-desktop','nav-mobile'].forEach(function(id){
      var nav = document.getElementById(id);
      if (!nav) return;

      var link = nav.querySelector('[data-quality-open-favorites-menu]');
      if (!link) {
        link = document.createElement('a');
        link.href = '#favoritos';
        link.className = 'quality-favorites-menu-link';
        link.setAttribute('data-quality-open-favorites-menu', '1');
        link.setAttribute('aria-label', 'Abrir favoritos');
      }

      // V8.2.2.6: padroniza a posição do Favoritos.
      // Mesmo que o menu da home carregue categorias depois, cada atualização move o link
      // para o final do menu, imediatamente antes da busca no desktop.
      var search = findSearchInside(nav);
      if (search && search.parentNode === nav) nav.insertBefore(link, search);
      else nav.appendChild(link);

      link.innerHTML = menuHtml(count);
    });
  }

  function itemHtml(item){
    var name = (item && (item.name || item.nome)) || 'Produto';
    var u = productUrl(item);
    var k = productKey(item);
    return '<div class="quality-favorites-panel-item">' +
      '<a class="quality-favorites-panel-img" href="' + esc(u) + '"><img src="' + esc(productImg(item)) + '" alt="' + esc(name) + '" onerror="this.onerror=null;this.src=\'/images/sem-imagem.png\';"></a>' +
      '<div class="quality-favorites-panel-info">' +
        '<a class="quality-favorites-panel-name" href="' + esc(u) + '">' + esc(name) + '</a>' +
        '<div class="quality-favorites-panel-actions">' +
          '<a href="' + esc(u) + '" class="btn-details quality-favorites-see">Ver detalhes</a>' +
          '<button type="button" class="quality-favorites-remove" data-quality-remove-favorite-menu="' + esc(k) + '">Remover</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function panelShell(){
    var panel = document.querySelector('.quality-favorites-panel-global');
    if (!panel) {
      panel = document.createElement('div');
      panel.className = 'quality-favorites-panel quality-favorites-panel-global';
      panel.innerHTML =
        '<div class="quality-favorites-panel-backdrop" data-quality-close-favorites-menu></div>' +
        '<aside class="quality-favorites-panel-box" aria-label="Meus favoritos">' +
          '<div class="quality-favorites-panel-head">' +
            '<strong>❤️ Meus favoritos</strong>' +
            '<button type="button" data-quality-close-favorites-menu aria-label="Fechar">×</button>' +
          '</div>' +
          '<div class="quality-favorites-panel-top"></div>' +
          '<div class="quality-favorites-panel-body"></div>' +
        '</aside>';
      document.body.appendChild(panel);
    }
    return panel;
  }

  function openPanel(){
    var panel = panelShell();
    var items = readFavorites();
    var top = panel.querySelector('.quality-favorites-panel-top');
    var body = panel.querySelector('.quality-favorites-panel-body');

    top.innerHTML = items.length
      ? '<button type="button" class="quality-favorites-clear-all" data-quality-clear-favorites-menu><i class="fa-regular fa-trash-can"></i> Remover todos</button>'
      : '';

    body.innerHTML = items.length
      ? items.map(itemHtml).join('')
      : '<p class="quality-favorites-empty">Você ainda não favoritou nenhum produto.</p>';

    panel.classList.add('is-open');
    panel.classList.add('show');
    document.body.classList.add('quality-favorites-open');
  }

  function closePanel(){
    document.querySelectorAll('.quality-favorites-panel').forEach(function(panel){
      panel.classList.remove('is-open');
      panel.classList.remove('show');
    });
    document.body.classList.remove('quality-favorites-open');
  }

  function refreshSoon(){
    refreshTimers.forEach(clearTimeout);
    refreshTimers = [
      setTimeout(ensureMenu, 60),
      setTimeout(ensureMenu, 220),
      setTimeout(ensureMenu, 700)
    ];
  }

  document.addEventListener('click', function(ev){
    var open = ev.target.closest('[data-quality-open-favorites-menu]');
    if (open) { ev.preventDefault(); openPanel(); return; }

    if (ev.target.closest('[data-quality-close-favorites-menu]')) {
      ev.preventDefault();
      closePanel();
      return;
    }

    var clear = ev.target.closest('[data-quality-clear-favorites-menu]');
    if (clear) {
      ev.preventDefault();
      if (confirm('Remover todos os favoritos deste navegador?')) {
        writeFavorites([]);
        ensureMenu();
        closePanel();
        if (window.qualityUpdateFavoriteButtons) { try { window.qualityUpdateFavoriteButtons(); } catch(e){} }
      }
      return;
    }

    var remove = ev.target.closest('[data-quality-remove-favorite-menu]');
    if (remove) {
      ev.preventDefault();
      var k = remove.getAttribute('data-quality-remove-favorite-menu') || '';
      writeFavorites(readFavorites().filter(function(item){ return productKey(item) !== k; }));
      ensureMenu();
      if (readFavorites().length) openPanel(); else closePanel();
      if (window.qualityUpdateFavoriteButtons) { try { window.qualityUpdateFavoriteButtons(); } catch(e){} }
      return;
    }

    if (ev.target.closest('[data-quality-fav]')) refreshSoon();
  }, true);

  window.addEventListener('storage', ensureMenu);
  document.addEventListener('DOMContentLoaded', function(){ ensureMenu(); refreshSoon(); });
  window.qualityRefreshFavoritesMenu = ensureMenu;

  ensureMenu();
  setTimeout(ensureMenu, 300);
  setTimeout(ensureMenu, 1000);
  setTimeout(ensureMenu, 2000);
})();
</script>
