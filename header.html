<style>
.cat-menu-group{position:relative;display:inline-flex;align-items:center;align-self:stretch}
.cat-menu-group>.cat-link{display:flex;align-items:center;height:100%;white-space:nowrap}
.cat-menu-caret{font-size:10px;margin-left:3px;opacity:.8}
.cat-submenu{position:absolute;top:calc(100% - 1px);left:0;min-width:185px;background:#fff;border:1px solid rgba(0,0,0,.10);border-radius:0 0 10px 10px;box-shadow:0 12px 28px rgba(0,0,0,.16);padding:7px;display:none;z-index:1000}
.cat-menu-group:hover .cat-submenu,.cat-menu-group:focus-within .cat-submenu{display:grid;gap:2px}
.cat-submenu .cat-sub-link{display:block!important;height:auto!important;padding:9px 11px!important;border-radius:7px;color:#222!important;text-decoration:none!important;white-space:nowrap}
.cat-submenu .cat-sub-link:hover{background:#f3f4f6;color:#c90000!important}
.cat-mobile-group{display:block}
.cat-mobile-submenu{display:grid;gap:2px;padding:0 0 6px 18px}
.mobile-nav .cat-sub-link-mobile{font-size:.92em;opacity:.9;padding-top:7px!important;padding-bottom:7px!important}
@media(max-width:850px){.nav-desktop .cat-menu-group{display:none}}
</style>
<header class="header">
  <div class="header-container">
    <a href="/" class="logo-wrapper" data-home-link>
      <img src="/images/logo.png" onerror="this.onerror=null;this.src='/site/images/logo.png';" alt="Quality Celulares" class="logo">
    </a>

    <nav class="nav-desktop" id="nav-desktop">
      <a href="/" data-home-link>Início</a>
          <div class="cat-menu-group">
            <a href="/smartphones/" class="cat-link cat-parent-link">Smartphones <span class="cat-menu-caret">▾</span></a>
            <div class="cat-submenu"><a href="/smartphones/?subcategoria=usados" class="cat-sub-link">Usados</a></div>
          </div>
          <a href="/acessorios/" class="cat-link">Acessórios</a>
          <a href="/eletronicos/" class="cat-link">Eletrônicos</a>
          <a href="/assistencia-tecnica/" class="cat-link">Assistência Técnica</a>
      <div class="search-wrapper">
        <input type="text" id="search-input" placeholder="Buscar...">
        <button id="search-button" aria-label="Buscar">
          <i class="fa fa-search"></i>
        </button>
      </div>
    </nav>

    <button id="menu-toggle" class="menu-toggle" aria-label="Abrir menu">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>

  <div id="mobile-menu" class="mobile-menu" aria-hidden="true">
    <div class="mobile-menu-header">
      <a href="/" class="logo-wrapper" data-home-link>
        <img src="/images/logo.png" onerror="this.onerror=null;this.src='/site/images/logo.png';" alt="Quality Celulares" class="logo">
      </a>
      <button id="menu-close" class="menu-close" aria-label="Fechar menu">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="search-wrapper-mobile">
      <input type="text" id="search-input-mobile" placeholder="Buscar...">
      <button id="search-button-mobile" aria-label="Buscar">
        <i class="fa fa-search"></i>
      </button>
    </div>

    <nav class="mobile-nav" id="nav-mobile">
      <a href="/" data-home-link>Início</a>
          <div class="cat-mobile-group">
            <a href="/smartphones/" class="cat-link">Smartphones</a>
            <div class="cat-mobile-submenu"><a href="/smartphones/?subcategoria=usados" class="cat-sub-link cat-sub-link-mobile">Usados</a></div>
          </div>
          <a href="/acessorios/" class="cat-link">Acessórios</a>
          <a href="/eletronicos/" class="cat-link">Eletrônicos</a>
          <a href="/assistencia-tecnica/" class="cat-link">Assistência Técnica</a>
    </nav>
  </div>

  <div id="menu-overlay" class="menu-overlay"></div>
</header>
<script>
(function(){
  var isLocalPreview = window.location.hostname === 'localhost' && window.location.port === '3000';
  if (isLocalPreview) {
    document.querySelectorAll('[data-home-link]').forEach(function(a){
      a.setAttribute('href', '/site/view/index.html');
    });
  }
})();
</script>
